<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin • Bomburgão</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #09090c; color: #f5f5f5; min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .box {
      width: 100%; max-width: 380px; background: #14141a;
      border: 1px solid #282834; border-radius: 14px; padding: 24px;
    }
    h1 { color: #ffb703; font-size: 1.35rem; margin-bottom: 6px; }
    p { color: #a1a1aa; font-size: 0.88rem; margin-bottom: 16px; }
    input {
      width: 100%; padding: 11px 12px; border-radius: 8px;
      border: 1px solid #2b2b38; background: #0c0c10; color: #fff; margin-bottom: 12px;
    }
    button {
      width: 100%; padding: 12px; border: none; border-radius: 8px;
      background: #ff8c00; color: #000; font-weight: 800; cursor: pointer;
    }
    .msg-erro { color: #f87171; font-size: 0.85rem; margin-bottom: 10px; }
    .voltar { display: block; text-align: center; margin-top: 14px; color: #a1a1aa; font-size: 0.85rem; text-decoration: none; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Painel Bomburgão</h1>
    <p>Digite a senha para gerenciar preços, itens e entrega.</p>
    {% with msgs = get_flashed_messages(category_filter=['erro']) %}
      {% for m in msgs %}<div class="msg-erro">{{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="POST">
      <input type="password" name="senha" placeholder="Senha do administrador" required>
      <button type="submit">Entrar</button>
    </form>
    <a class="voltar" href="/">← Voltar ao cardápio</a>
  </div>
</body>
</html>
